# The `eot` package you build in exercise 05 (src/eot). pixi installs it in
# editable mode, so notebooks, tests and Snakemake rules all `import eot` and see
# your edits immediately.
[project]
name = "eot"
version = "0.1.0"
description = "Evolution of Trust model — built in The Agentic Research Workflow"
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eot"]

# marimo: run every cell when a notebook opens (marimo's default is now off);
# when src/eot changes, mark the cells that use it as stale.
[tool.marimo.runtime]
auto_instantiate = true
auto_reload = "lazy"
